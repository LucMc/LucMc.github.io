project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - cv.qmd
    - publications.qmd
    - projects.qmd
    - about.qmd

website:
  title: "Luc McCutcheon"
  favicon: "https://avatars.githubusercontent.com/u/61504689?s=400&u=1fa60abecd77faac384bba6c54ee26379ffd5aca&v=4"
  navbar:
    background: "#000000"
    foreground: "#e8e8e8"
    left:
      - href: index.qmd
        text: Home
      - href: cv.qmd
        text: CV
      - href: publications.qmd
        text: Publications
      - href: projects.qmd
        text: Projects
      - href: about.qmd
        text: About
  page-footer:
    center: "&copy; 2026 Luc McCutcheon"
    background: "#000000"
    foreground: "#9ca3af"

format:
  html:
    theme:
      - darkly
      - _styles/custom.scss
    css: _styles/styles.css
    toc: true
    toc-depth: 3
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
